<div class="login-wrapper">
  <div class="form-container">
    <img class="logo" src="../../assets/T-SYSTEMS-LOGO.svg" alt="logo" />

    <h2 class="form-title">{{ 'passwordReset.reset.title' | translate }}</h2>

    <p class="form-description">
      {{ 'passwordReset.reset.info' | translate }}
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form" autocomplete="off">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>{{ 'contrasena' | translate }}</mat-label>
        <input
          matInput
          [type]="hidePassword['password'] ? 'password' : 'text'"
          formControlName="password"
          [placeholder]="'placeholderContrasena' | translate"
          autocomplete="new-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="clickEvent('password', $event)"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hidePassword['password']"
        >
          <mat-icon>
            {{ hidePassword['password'] ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>{{ 'repiteContrasena' | translate }}</mat-label>
        <input
          matInput
          [type]="hidePassword['repeatPassword'] ? 'password' : 'text'"
          formControlName="repeatPassword"
          [placeholder]="'repiteContrasena' | translate"
          autocomplete="new-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="clickEvent('repeatPassword', $event)"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hidePassword['repeatPassword']"
        >
          <mat-icon>
            {{ hidePassword['repeatPassword'] ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </button>
      </mat-form-field>

      <div *ngIf="form.errors?.['notSame'] && form.touched" class="error-message">
        {{ 'contrasenaNoCoincide' | translate }}
      </div>

      <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error-message">
        {{ 'requisitosContrasena' | translate }}
      </div>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="submit-button"
        [disabled]="submitting || !form.valid"
      >
        {{ 'passwordReset.reset.change' | translate }}
      </button>
    </form>
  </div>
</div>
