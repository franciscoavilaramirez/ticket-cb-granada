<div class="modal-wrapper">
  <div class="title">
    {{"modificarUsuario.titulo" | translate }}
  </div>

  <form [formGroup]="updateUserForm" class="form-container">
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>{{"nombre" | translate }}</mat-label>
      <input type="text" matInput formControlName="nombre">
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>{{"apellidos" | translate }}</mat-label>
      <input type="text" matInput formControlName="apellidos">
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>{{"email" | translate }}</mat-label>
      <input type="email" matInput formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>{{"contrasena" | translate }}</mat-label>
      <input matInput formControlName="contrasena" [type]="hidePassword['contrasenaNueva'] ? 'password' : 'text'" />
      <button mat-icon-button
              matSuffix
              type="button"
              (click)="clickEvent('contrasenaNueva', $event)"
              [attr.aria-label]="'Ocultar contraseña'"
              [attr.aria-pressed]="hidePassword['contrasenaNueva']">
        <mat-icon>{{hidePassword['contrasenaNueva'] ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>{{"repiteContrasena" | translate }}</mat-label>
      <input matInput formControlName="repiteContrasena" [type]="hidePassword['contrasenaRepetida'] ? 'password' : 'text'" />
      <button mat-icon-button
              matSuffix
              type="button"
              (click)="clickEvent('contrasenaRepetida', $event)"
              [attr.aria-label]="'Ocultar contraseña'"
              [attr.aria-pressed]="hidePassword['contrasenaRepetida']">
        <mat-icon>{{hidePassword['contrasenaRepetida'] ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
    </mat-form-field>

    <div *ngIf="updateUserForm.get('contrasena')?.hasError('pattern') && updateUserForm.get('contrasena')?.touched" class="error-message password-pattern">
      {{"requisitosContrasena" | translate }}
    </div>
    <div *ngIf="updateUserForm.errors?.['notSame'] && updateUserForm.dirty" class="error-message">
      {{"contrasenaNoCoincide" | translate }}
    </div>

    <div class="button-group">
      <button mat-raised-button class="buttons__guardar" color="primary" (click)="onSubmit()" [disabled]="!updateUserForm.valid">{{"botones.guardarCambios" | translate }}</button>
      <button mat-raised-button class="buttons__cancelar" color="warn" (click)="closedModal()">{{"botones.cancelar" | translate }}</button>
    </div>

  </form>
</div>
